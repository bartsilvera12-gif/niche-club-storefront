<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>QA del panel — Niche Club</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<meta name="theme-color" content="#080808" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#080808; --ink:#FBF8F2; --muted:#A9A49A; --soft:#7E786E; --gold:#E3C492; --gold-2:#B99B63; --line:rgba(227,196,146,0.12); --ok:#9CC59A; }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:300 15px/1.7 'Manrope',sans-serif; }
  a { color:var(--gold); text-decoration:none; }
  a:hover { color:#FFFFFF; }
  code { font:400 13px/1.4 ui-monospace,Consolas,monospace; color:var(--ink); background:rgba(227,196,146,0.08); padding:1px 6px; border-radius:5px; overflow-wrap:anywhere; }
  ::selection { background:var(--gold); color:#080808; }
  header { position:sticky; top:0; z-index:10; background:rgba(8,8,8,0.94); border-bottom:1px solid var(--line); backdrop-filter:blur(8px); }
  .bar { max-width:1400px; margin:0 auto; padding:10px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .brand img { height:46px; width:auto; display:block; }
  .brand span { font:500 16px/1 'Cormorant Garamond',serif; letter-spacing:.26em; color:var(--gold); }
  .progress { display:flex; align-items:center; gap:12px; font:400 11px/1 'Manrope',sans-serif; letter-spacing:.14em; text-transform:uppercase; color:#CFCAC2; }
  .meter { width:120px; height:4px; border-radius:999px; background:rgba(255,255,255,0.08); overflow:hidden; }
  .meter i { display:block; height:100%; width:0; background:var(--gold); transition:width .3s ease; }
  main { max-width:820px; margin:0 auto; padding:clamp(44px,7vw,96px) 22px clamp(60px,8vw,110px); }
  .kicker { font:400 10px/1 'Manrope',sans-serif; letter-spacing:.34em; text-transform:uppercase; color:var(--gold-2); }
  h1 { margin:18px 0 0; font:300 clamp(34px,5.4vw,58px)/1.04 'Cormorant Garamond',serif; letter-spacing:-0.015em; }
  .lead { margin:18px 0 0; color:var(--muted); max-width:620px; }
  .tools { display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; }
  .btn { display:inline-flex; align-items:center; min-height:40px; padding:0 18px; border-radius:999px; border:1px solid rgba(227,196,146,0.3); background:transparent; color:var(--ink); font:400 11px/1 'Manrope',sans-serif; letter-spacing:.18em; text-transform:uppercase; cursor:pointer; }
  .btn:hover { border-color:var(--gold); color:var(--gold); }
  .rule { height:2px; width:84px; background:var(--gold-2); margin:clamp(28px,4vw,40px) 0; }
  section { margin-top:clamp(34px,5vw,50px); }
  .sec-head { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:6px; }
  h2 { margin:0; font:400 clamp(22px,2.6vw,28px)/1.2 'Cormorant Garamond',serif; }
  .count { flex:none; font:400 11px/1 'Manrope',sans-serif; letter-spacing:.14em; color:var(--soft); }
  .count.done { color:var(--ok); }
  .note { margin:0 0 10px; color:var(--muted); font-size:14px; }
  ol { list-style:none; margin:0; padding:0; display:grid; gap:8px; }
  .step { display:grid; grid-template-columns:26px 1fr; gap:12px; padding:14px 16px; border:1px solid rgba(255,255,255,0.06); border-radius:14px; background:#0D0D0D; cursor:pointer; transition:border-color .2s, opacity .2s; }
  .step:hover { border-color:var(--line); }
  .step input { appearance:none; width:22px; height:22px; margin:2px 0 0; border:1px solid rgba(227,196,146,0.4); border-radius:6px; display:grid; place-items:center; cursor:pointer; }
  .step input:checked { background:var(--gold); border-color:var(--gold); }
  .step input:checked::after { content:''; width:10px; height:6px; border:2px solid #080808; border-top:0; border-right:0; transform:translateY(-1px) rotate(-45deg); }
  .step input:focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .step .txt { color:var(--ink); }
  .step .exp { display:block; margin-top:4px; color:var(--muted); font-size:14px; }
  .step .exp b { font-weight:500; color:var(--gold-2); }
  .step.checked { opacity:.5; }
  .step.checked .txt { text-decoration:line-through; text-decoration-color:rgba(251,248,242,0.35); }
  footer { border-top:1px solid var(--line); padding:22px; }
  .foot { max-width:1400px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:space-between; gap:8px 24px; font:300 11px/1.6 'Manrope',sans-serif; color:#8C857B; }
  .foot a { color:#CFCAC2; font-weight:400; }
  @media (max-width:560px) {
    .brand span { display:none; }
    .meter { width:80px; }
    .step { padding:12px 14px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="admin/"><img src="img/logo-icono.png" alt="Niche Club" /><span>NICHE CLUB</span></a>
    <div class="progress"><span id="total">0 / 0</span><span class="meter"><i id="meter"></i></span></div>
  </div>
</header>

<main>
  <span class="kicker">Control de calidad</span>
  <h1>QA del panel de administración</h1>
  <p class="lead">Probá cada paso en orden. Cada uno dice qué hacer y qué tiene que pasar; marcalo cuando se cumple. Las marcas quedan guardadas en este navegador.</p>
  <div class="tools">
    <a class="btn" href="admin/" target="_blank" rel="noopener">Abrir el panel</a>
    <button class="btn" id="reset" type="button">Desmarcar todo</button>
  </div>
  <div class="rule"></div>
  <div id="sections"></div>
</main>

<footer>
  <div class="foot">
    <span>© 2026 Niche Club · Paraguay</span>
    <span>Desarrollado por <a href="https://neura.com.py" target="_blank" rel="noopener">Neura</a></span>
  </div>
</footer>

<script>
(function () {
  // Cada paso: [qué hacer, qué tiene que pasar]. El texto entre `` se muestra como código.
  var SECTIONS = [
    { title: 'Antes de empezar', note: 'Conviene probar con una fragancia de prueba ("Fragancia QA") y borrarla al final, para no tocar las reales.', steps: [
      ['El schema `nicheclubweb` está en `PGRST_DB_SCHEMAS` y se reinició el contenedor `rest`.'],
      ['El usuario `admin@nicheclubpy.com` existe en Authentication → Users.'],
      ['Se corrió `supabase/nicheclub.sql` completo.', 'Terminó con "Listo: admin@nicheclubpy.com tiene acceso al panel".'],
      ['El sitio está subido con la versión más nueva (incluye `admin/`, `settings.js` y `supabase-config.js`).'],
      ['Tenés a mano una foto de prueba (JPG o PNG) y otra cuenta de ese Supabase que no sea admin.'],
      ['Vas a probar en una computadora (Chrome) y en un celular.']
    ]},
    { title: '1. Ingreso y sesión', steps: [
      ['Abrí `/admin`.', 'Pantalla "Panel" con el logo, el email `admin@nicheclubpy.com` ya escrito y la contraseña vacía.'],
      ['Escribí una contraseña incorrecta y tocá Ingresar.', '"Email o contraseña incorrectos." y no entra.'],
      ['Ingresá con otra cuenta de ese Supabase que no sea admin.', '"Esta cuenta no tiene acceso al panel." y no entra.'],
      ['Ingresá con `admin@nicheclubpy.com` y la contraseña correcta.', 'Se abre Fragancias con las 19 fragancias y los contadores (en total, visibles, agotadas).'],
      ['Recargá la página.', 'Sigue adentro, sin volver a pedir contraseña.'],
      ['Cerrá la pestaña y volvé a abrir `/admin`.', 'Sigue adentro.'],
      ['Menú ··· → Cerrar sesión.', 'Vuelve a la pantalla de ingreso; al recargar sigue pidiendo contraseña.'],
      ['Volvé a ingresar para seguir con el QA.']
    ]},
    { title: '2. Fragancias: lista, filtros y guardado', steps: [
      ['Escribí "tom" en el buscador.', 'Quedan solo las de Tom Ford; las flechas de ordenar se desactivan mientras hay filtro.'],
      ['Borrá la búsqueda y elegí "Árabe" en el filtro de tipos.', 'Solo fragancias árabes. Volvé a "Todos los tipos".'],
      ['Elegí "Afnan" en el filtro de marcas.', 'Solo las 2 fragancias de Afnan. Volvé a "Todas las marcas".'],
      ['Cambiá el precio de 5 ml de una fragancia (por ejemplo 150000).', 'Se formatea como "150.000", la fila se marca con borde dorado y aparece abajo "1 cambio sin guardar".'],
      ['Cambiá el estado de otra fragancia a "Agotado".', 'La barra dice "2 cambios sin guardar" y sube el contador de agotadas.'],
      ['Apagá el interruptor Visible de una tercera.', 'La fila queda más tenue y baja el contador de visibles.'],
      ['Bajá una fragancia un lugar con la flecha.', 'Cambia de posición y el número de la izquierda se actualiza.'],
      ['Tocá Descartar y confirmá.', 'Todo vuelve a como estaba y la barra desaparece.'],
      ['Repetí los cambios de precio, agotado y visible, y tocá Guardar.', '"Guardado. El sitio ya muestra los cambios." y la barra desaparece.'],
      ['Recargá el panel.', 'Los cambios siguen ahí.'],
      ['Tocá la X de una fragancia y confirmá.', 'Sale de la lista pero no se borra hasta guardar. Tocá Descartar para recuperarla.']
    ]},
    { title: '3. Nueva fragancia y edición', steps: [
      ['Tocá "+ Nueva fragancia" y después "Listo" sin completar nada.', '"Elegí una marca." y el diálogo sigue abierto.'],
      ['Abrí el selector de Marca.', 'Desplegable oscuro con buscador y las marcas en orden alfabético (no la lista blanca del navegador).'],
      ['Escribí "cre"; después borrá y escribí "Prueba QA".', 'Primero queda solo Creed; después aparece "+ Agregar marca «Prueba QA»".'],
      ['Tocá esa opción (o Enter).', 'Aviso "Marca «Prueba QA» agregada." y queda elegida.'],
      ['En Tipo, agregá "Unisex" de la misma forma.', 'Queda elegido y aparece en el filtro de tipos de la lista.'],
      ['Probá el teclado en un selector.', 'Flechas arriba y abajo mueven, Enter elige, Esc cierra el selector sin cerrar el diálogo.'],
      ['Completá Nombre "Fragancia QA", precios 50000 y 80000, y tocá Listo sin foto.', '"Subí una foto."'],
      ['Tocá "Cambiar foto" y elegí tu foto de prueba.', '"Subiendo foto…", después "Foto lista." y se ve la vista previa.'],
      ['Probá subir un archivo que no sea imagen (un PDF).', '"Formato no soportado. Usá JPG, PNG o WEBP."'],
      ['Tocá Listo y después Guardar.', 'La fragancia aparece primera en la lista y queda guardada.'],
      ['Editá "Fragancia QA" con el lápiz: estado "Por encargo" y guardá.', 'El cambio se ve en la fila y persiste al recargar.']
    ]},
    { title: '4. Marcas y tipos', steps: [
      ['Abrí la pestaña "Marcas y tipos".', 'Dos tarjetas; cada marca muestra cuántas fragancias la usan y cada tipo su dirección (por ejemplo `/fragancias#arabes`).'],
      ['Agregá la marca "Marca QA".', 'Aparece en la lista con "Sin fragancias".'],
      ['Intentá agregar "marca qa" (en minúsculas).', '"Esa marca ya existe."'],
      ['Renombrá "Prueba QA" a "Prueba QA 2" con el lápiz y Enter.', '"Nombre actualizado."; en Fragancias, "Fragancia QA" ya muestra la marca nueva.'],
      ['Tocá "2 fragancias" debajo de Afnan.', 'Va a Fragancias con el filtro de marca en Afnan.'],
      ['Mirá la X de una marca con fragancias (por ejemplo Creed).', 'Está desactivada; al pasar el mouse dice "En uso: no se puede eliminar".'],
      ['Eliminá "Marca QA".', 'Pide confirmación y desaparece.'],
      ['Subí "Unisex" con la flecha hasta arriba de Árabe.', 'Cambia el orden; al recargar se mantiene.'],
      ['Abrí `/fragancias` en otra pestaña.', 'Los filtros siguen el mismo orden e incluyen Unisex; `/fragancias#unisex` lo deja elegido.']
    ]},
    { title: '5. Configuración', steps: [
      ['Abrí la pestaña "Configuración".', 'WhatsApp "0994 146975", Instagram "nicheclub.py", email vacío y las 4 fotos de portada; "Guardar configuración" desactivado.'],
      ['En WhatsApp escribí "+595 981 123456".', 'Debajo dice "Se muestra como 0981 123456 · wa.me/595981123456" y aparece "Hay cambios sin guardar".'],
      ['En Instagram pegá `https://instagram.com/nicheclub.py/`.', 'Al guardar queda solo "nicheclub.py".'],
      ['Escribí un email inválido ("hola@") y guardá.', '"Revisá el email." y no guarda.'],
      ['Tocá Descartar.', 'Vuelven los valores guardados.'],
      ['Cambiá la Portada 1 con tu foto de prueba.', 'Se abre "Recortar foto" con un marco vertical 3:4 y el tamaño 1200 × 1600 px; si la foto es chica, aparece un aviso.'],
      ['Arrastrá la foto, usá el zoom y tocá "Usar esta foto".', 'El botón dice "Subiendo…" y Guardar queda bloqueado hasta que termina; después se ve la foto recortada.'],
      ['Probá "Cambiar" en Sección final y tocá Cancelar.', 'El marco es horizontal 16:9; al cancelar no cambia nada.'],
      ['Poné un email válido y guardá.', '"Configuración guardada. El sitio ya la muestra."'],
      ['Después de revisar el sitio (sección 7), volvé a poner el WhatsApp y el Instagram originales, y subí como Portada 1 la foto original (`img/layton-exclusif.jpeg` del proyecto).']
    ]},
    { title: '6. Copias de seguridad y contraseña', steps: [
      ['Menú ··· → Copias de seguridad.', 'Una copia por cada vez que guardaste el catálogo, con fecha y hora, la más nueva arriba.'],
      ['Restaurá la copia anterior a crear "Fragancia QA" y confirmá.', '"Catálogo restaurado." y "Fragancia QA" desaparece de la lista.'],
      ['Volvé a abrir Copias de seguridad.', 'Hay una copia nueva arriba (el estado antes de restaurar), así que la restauración se puede deshacer.'],
      ['Menú → Cambiar contraseña, con la contraseña actual incorrecta.', '"La contraseña actual no es correcta."'],
      ['Probá una contraseña nueva de menos de 10 caracteres.', 'No la acepta.'],
      ['Cambiala por una válida, cerrá sesión y entrá con la nueva.', 'Entra; con la vieja ya no.']
    ]},
    { title: '7. Verificación en el sitio público', note: 'Hacela en una ventana de incógnito, para ver el sitio como un cliente.', steps: [
      ['En `/fragancias`, buscá la fragancia que pusiste "Agotado".', 'Muestra "Agotado" en lugar de "Agregar"; en su ficha "Agregar al carrito" también dice "Agotado" y "Consultar por WhatsApp" sigue funcionando.'],
      ['Buscá la fragancia con Visible apagado.', 'No aparece en el catálogo ni en la búsqueda.'],
      ['Mirá la fragancia a la que le cambiaste el precio.', 'Se ve con el valor nuevo, en la tarjeta y en el carrito.'],
      ['Compará el orden con el del panel.', 'Es el mismo.'],
      ['Agregá una fragancia disponible al carrito y tocá "Finalizar por WhatsApp".', 'Abre WhatsApp al número configurado, con el pedido y el total.'],
      ['Abrí el inicio.', 'La Portada 1 muestra la foto nueva y el pie tiene el WhatsApp, el Instagram y el email configurados.'],
      ['Tocá el Instagram del pie.', 'Abre el perfil configurado.'],
      ['Abrí `/privacidad`.', 'El WhatsApp y el Instagram del texto son los configurados.'],
      ['Volvé al panel y devolvé los valores originales (sección 5).', 'El sitio los vuelve a mostrar.']
    ]},
    { title: '8. Celular y casos borde', steps: [
      ['Abrí `/admin` en el celular.', 'Las tres pestañas entran en el ancho, cada fragancia se ve como tarjeta y no hay scroll horizontal.'],
      ['En el celular, cambiá un precio y guardá desde la barra de abajo.', 'Funciona igual que en la computadora.'],
      ['En el celular, abrí "Nueva fragancia" y usá los selectores de marca y tipo.', 'Se abren completos dentro del diálogo y se eligen con el dedo.'],
      ['En el celular, subí una foto tomada con la cámara.', 'Se sube y se achica sola (alrededor de 150 KB).'],
      ['En la computadora, hacé un cambio sin guardar y cerrá la pestaña.', 'El navegador pregunta si querés salir.'],
      ['Con un cambio sin guardar, tocá Cerrar sesión.', 'Pregunta "Hay cambios sin guardar. ¿Salir igual?".'],
      ['Cortá internet, hacé un cambio y tocá Guardar.', '"No se pudo conectar con el servidor." y el cambio sigue pendiente; al volver la conexión, Guardar funciona.'],
      ['Limpieza final: eliminá "Fragancia QA" si quedó, y la marca "Prueba QA 2" y el tipo "Unisex" si no los vas a usar.']
    ]}
  ];

  var KEY = 'nicheclub.qa';
  var done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { done = {}; }
  var save = function () { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };

  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var fmt = function (s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); };

  var html = '';
  SECTIONS.forEach(function (sec, si) {
    html += '<section><div class="sec-head"><h2>' + esc(sec.title) + '</h2><span class="count" data-sec="' + si + '"></span></div>';
    if (sec.note) html += '<p class="note">' + fmt(sec.note) + '</p>';
    html += '<ol>';
    sec.steps.forEach(function (st, i) {
      var id = si + '-' + i;
      html += '<li><label class="step" data-id="' + id + '"><input type="checkbox" data-id="' + id + '"><span><span class="txt">' + fmt(st[0]) + '</span>'
        + (st[1] ? '<span class="exp"><b>Esperado:</b> ' + fmt(st[1]) + '</span>' : '') + '</span></label></li>';
    });
    html += '</ol></section>';
  });
  document.getElementById('sections').innerHTML = html;

  function paint() {
    var total = 0, checked = 0;
    SECTIONS.forEach(function (sec, si) {
      var c = 0;
      sec.steps.forEach(function (st, i) { if (done[si + '-' + i]) c++; });
      total += sec.steps.length; checked += c;
      var el = document.querySelector('[data-sec="' + si + '"]');
      el.textContent = c + ' / ' + sec.steps.length;
      el.classList.toggle('done', c === sec.steps.length);
    });
    document.querySelectorAll('.step').forEach(function (l) {
      var on = !!done[l.dataset.id];
      l.classList.toggle('checked', on);
      l.querySelector('input').checked = on;
    });
    document.getElementById('total').textContent = checked + ' / ' + total;
    document.getElementById('meter').style.width = (total ? checked / total * 100 : 0) + '%';
  }

  document.getElementById('sections').addEventListener('change', function (ev) {
    var id = ev.target.dataset.id;
    if (!id) return;
    if (ev.target.checked) done[id] = true; else delete done[id];
    save();
    paint();
  });
  document.getElementById('reset').addEventListener('click', function () {
    if (!confirm('¿Desmarcar todos los pasos?')) return;
    done = {};
    save();
    paint();
  });
  paint();
})();
</script>
</body>
</html>
